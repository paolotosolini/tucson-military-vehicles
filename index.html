<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tucson Military Vehicle Museum</title>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="loader" class="loader" role="status" aria-live="polite">

    <div id="ui" class="ui">
      <header class="brand">
        <p class="brand__title">Tucson Military Vehicle Museum</p>
        <p class="brand__subtitle">Tucson, Arizona</p>
      </header>
      <p class="credit">Created by Paolo Tosolini</p>
    </div>
    <div id="fade" class="fade" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
